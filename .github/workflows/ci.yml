name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . tzdata build
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_bundle.py
      - run: python scripts/check_package.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: skillscout-portable
          path: |
            dist/skillscout.zip
            dist/SHA256SUMS
          retention-days: 30
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . 'skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@9dbf4fc75386169275e5f18c47686cb0d7274afa'
      - run: python -m unittest tests.test_real_scanner -v
        env:
          SKILLSCOUT_REAL_SCANNER: '1'
      - run: python scripts/live_github_check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

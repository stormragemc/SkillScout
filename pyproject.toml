[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscout"
version = "0.1.0"
description = "Discover useful agent skills, compare your setup, scan, and approve before installing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "stormragemc"}]
dependencies = ["tzdata>=2025.2; sys_platform == 'win32'"]

[project.scripts]
skillscout = "skillscout.cli:main"

[project.urls]
Repository = "https://github.com/stormragemc/SkillScout"
Issues = "https://github.com/stormragemc/SkillScout/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

